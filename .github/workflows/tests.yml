name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.1 torchvision==0.27.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Verify
        run: |
          python -m pip check
          python -m unittest discover -v
          python -m py_compile app.py auth.py core.py ewelink_cloud.py
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Setup VisionGate.ps1" -Action Plan -Backend CPU
